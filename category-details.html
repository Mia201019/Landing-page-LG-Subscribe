<style>
  :root{

    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--lg-white); color:var(--lg-ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Poppins',sans-serif;}
  .container{max-width:1240px; margin:0 auto; padding:0 28px;}
  @media(max-width:640px){.container{padding:0 18px;}}

  nav{position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:60; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--lg-line);}
  .nav-row{display:flex; align-items:center; justify-content:space-between; height:72px; gap:16px;}
  .nav-left{display:flex; align-items:center; gap:18px;}
  .nav-logo{font-family:'Poppins'; font-weight:700; font-size:20px;}
  .nav-logo span{color:var(--lg-red);}
  .back-link{color:var(--lg-sub); font-size:14.5px; font-weight:500; text-decoration:none; white-space:nowrap;}
  .back-link:hover{color:var(--lg-ink);}
  .lang-toggle{display:flex; background:var(--lg-mist); border-radius:999px; padding:4px; gap:2px;}
  .lang-btn{border:none; background:transparent; padding:8px 16px; border-radius:999px; font-family:'Inter'; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--lg-sub); transition:all .15s ease;}
  .lang-btn.active{background:var(--lg-red); color:#fff;}
  .nav-logo-img{height:30px; display:block;}

  header.page-head{padding:48px 0 28px; text-align:center; background:radial-gradient(ellipse at 50% 0%, #fff 0%, var(--lg-mist) 130%);}
  header.page-head h1{font-size:clamp(26px,3.6vw,38px); font-weight:700; margin:0 0 10px;}
  header.page-head p{color:var(--lg-sub); font-size:16px; max-width:560px; margin:0 auto 20px; line-height:1.55;}
  .period-pill{display:inline-block; background:var(--lg-red-tint); color:var(--lg-red); font-size:13.5px; font-weight:600; padding:9px 20px; border-radius:999px;}

  .tabs-wrap{position:sticky; top:72px; top:calc(env(safe-area-inset-top,0px) + 72px); z-index:50; background:#fff; border-bottom:1px solid var(--lg-line); padding:14px 0;}
  .tabs{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; border:1.5px solid var(--lg-line); background:#fff; color:var(--lg-ink); font-family:'Inter'; font-weight:600; font-size:14.5px; padding:11px 20px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:all .15s ease;}
  .tab:hover{border-color:var(--lg-ink);}
  .tab.active{background:var(--lg-red); border-color:var(--lg-red); color:#fff;}

  .results-bar{display:flex; align-items:center; justify-content:space-between; margin:28px 0 20px; flex-wrap:wrap; gap:10px;}
  .results-count{color:var(--lg-sub); font-size:14.5px; font-weight:500;}

  main{padding-bottom:80px;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}
  .pcard{background:#fff; border:1px solid var(--lg-line); border-radius:20px; padding:24px; transition:transform .2s ease, box-shadow .2s ease;}
  .pcard:hover{transform:translateY(-3px); box-shadow:0 20px 40px -26px rgba(0,0,0,.25);}
  .pcard-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .pcard-cat{font-size:12px; font-weight:600; color:var(--lg-red); text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px;}
  .pcard-model{font-family:'Poppins'; font-weight:600; font-size:16.5px; line-height:1.3; word-break:break-word;}
  .pimg{height:170px; margin:-4px 0 16px; border-radius:14px; background:#fff; border:1px solid var(--lg-line); display:flex; align-items:center; justify-content:center; overflow:hidden;}

  .pimg.empty{background:var(--lg-mist); border-color:var(--lg-mist);}
  .discount-badge{flex:none; background:var(--lg-red); color:#fff; font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap;}
  .price-row{display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap;}
  .price-list{color:var(--lg-sub); font-size:14px; text-decoration:line-through;}
  .price-sub{font-family:'Poppins'; font-weight:700; font-size:21px;}
  .price-caption{color:var(--lg-sub); font-size:12.5px; margin-bottom:16px;}
  .monthly-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .monthly-chip{min-width:0; background:var(--lg-mist); border-radius:12px; padding:10px 6px; text-align:center;}
  .monthly-chip .mc-term{font-size:11px; color:var(--lg-sub); font-weight:600; margin-bottom:3px;}
  .monthly-chip .mc-amt{font-family:'Poppins'; font-weight:700; font-size:12px; white-space:nowrap;}
  .gift-label{font-size:12px; font-weight:600; color:var(--lg-sub); margin-bottom:8px; text-transform:uppercase; letter-spacing:.3px;}
  .gift-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .gift-chip{background:var(--lg-red-tint); color:var(--lg-red); font-size:12px; font-weight:600; padding:5px 10px; border-radius:8px;}
  .no-gift{color:var(--lg-sub); font-size:12.5px; font-style:italic;}

  .filters{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-top:22px; padding:16px; background:var(--lg-mist); border-radius:16px;}
  .f-item{display:flex; flex-direction:column; gap:6px; min-width:150px; flex:1 1 150px;}
  .f-item.f-search{flex:2 1 240px;}
  .f-item label{font-size:11.5px; font-weight:600; color:var(--lg-sub); text-transform:uppercase; letter-spacing:.3px;}
  .f-item input,.f-item select{height:44px; border:1.5px solid var(--lg-line); border-radius:12px; background:#fff; padding:0 14px; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--lg-ink); width:100%;}
  .f-item input:focus,.f-item select:focus{outline:none; border-color:var(--lg-red);}
  .f-check{flex:0 0 auto; min-width:0; height:44px; display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--lg-line); border-radius:12px; padding:0 14px; font-size:14.5px; font-weight:500; cursor:pointer; user-select:none;}
  .f-check input{width:18px; height:18px; accent-color:var(--lg-red); margin:0;}
  .f-reset{flex:0 0 auto; height:44px; border:none; background:var(--lg-red); color:#fff; font-family:'Inter'; font-weight:600; font-size:14px; padding:0 20px; border-radius:12px; cursor:pointer;}
  .f-reset:hover{background:var(--lg-red-dark);}

  .empty-state{text-align:center; padding:80px 20px; color:var(--lg-sub);}
  .empty-state h3{font-size:20px; color:var(--lg-ink); margin-bottom:8px;}
</style>
</head>

    no_gift:'Không có quà tặng kèm', f_search:'Tìm mã sản phẩm', f_search_ph:'VD: OLED65, GR-X, F2514…', f_price:'Giá theo tháng (36 tháng)', f_disc:'Mức giảm', f_sort:'Sắp xếp', f_gift:'Có quà tặng', f_reset:'Xóa bộ lọc', none_h:'Không có sản phẩm phù hợp với bộ lọc', none_p:'Hãy thử đổi hoặc xóa bộ lọc.', p_all:'Tất cả mức giá', p1:'Dưới ₫500.000', p2:'₫500.000 – ₫1.000.000', p3:'₫1.000.000 – ₫2.000.000', p4:'Trên ₫2.000.000', d_all:'Mọi mức giảm', d10:'Từ 10% trở lên', d20:'Từ 20% trở lên', d30:'Từ 30% trở lên', s_def:'Mặc định', s_pa:'Giá: thấp đến cao', s_pd:'Giá: cao đến thấp', s_dd:'Mức giảm: cao đến thấp', empty_h:'Chưa có sản phẩm trong danh mục này', empty_p:'Chưa có chương trình khuyến mãi cho danh mục này.',

let lang = 'en';
let activeCat = 'all';
const PRICE_BANDS = [[0,Infinity],[0,500000],[500000,1000000],[1000000,2000000],[2000000,Infinity]];
const DISC_MIN = [0,10,20,30];
const hasGift = p => !!(p.evoucher || p.gift1 || p.gift2 || p.voucherSouth);

function fillSelect(id, keys){
  const el = document.getElementById(id), cur = el.value || '0';
  el.innerHTML = keys.map((k,i)=>`<option value="${i}">${I18N[lang][k]}</option>`).join('');
  el.value = cur;
}
function buildFilters(){
  fillSelect('fPrice',['p_all','p1','p2','p3','p4']);
  fillSelect('fDisc',['d_all','d10','d20','d30']);
  fillSelect('fSort',['s_def','s_pa','s_pd','s_dd']);
  document.getElementById('fSearch').placeholder = I18N[lang].f_search_ph;
}
function applyFilters(){ renderGrid(); }
function resetFilters(){
  document.getElementById('fSearch').value='';
  ['fPrice','fDisc','fSort'].forEach(id=>document.getElementById(id).value='0');
  document.getElementById('fGift').checked=false;
  renderGrid();
}

function fmt(n){ return '₫' + n.toLocaleString('vi-VN'); }

function setLang(l){
  lang = l;
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnKO').classList.toggle('active', l==='ko');
  document.getElementById('htmlRoot').lang = l;
  try{ localStorage.setItem('lg_lang', l); }catch(e){}
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  buildFilters();
  renderTabs();
  renderGrid();
}

function renderTabs(){
  const t = I18N[lang];
  const tabsEl = document.getElementById('tabs');
  const cats = ['all', ...CAT_ORDER];
  tabsEl.innerHTML = cats.map(c => {
    const label = c === 'all' ? t.tab_all : t.cats[c];
    const cls = c === activeCat ? 'tab active' : 'tab';
    return `<button class="${cls}" onclick="selectCat('${c}')">${label}</button>`;
  }).join('');
}

function selectCat(c){
  activeCat = c;
  renderTabs();
  renderGrid();
}

function renderGrid(){
  const t = I18N[lang];
  let list = activeCat === 'all' ? PRODUCTS.slice() : PRODUCTS.filter(p => p.cat === activeCat);
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  const band = PRICE_BANDS[+document.getElementById('fPrice').value];
  const dmin = DISC_MIN[+document.getElementById('fDisc').value];
  const sort = document.getElementById('fSort').value;
  if(q) list = list.filter(p => p.model.toLowerCase().includes(q));
  list = list.filter(p => p.m36 >= band[0] && p.m36 < band[1]);
  if(dmin) list = list.filter(p => (p.discount||0) >= dmin);
  if(document.getElementById('fGift').checked) list = list.filter(hasGift);
  if(sort==='1') list.sort((a,b)=>a.m36-b.m36);
  else if(sort==='2') list.sort((a,b)=>b.m36-a.m36);
  else if(sort==='3') list.sort((a,b)=>(b.discount||0)-(a.discount||0));
  const gridEl = document.getElementById('productGrid');
  const emptyEl = document.getElementById('emptyState');
  document.getElementById('resultsCount').textContent = t.results(list.length);

  if(list.length === 0){
    gridEl.style.display = 'none';
    emptyEl.style.display = 'block';
    const filtered = q || band[1]!==Infinity || band[0]>0 || dmin || document.getElementById('fGift').checked;
    emptyEl.querySelector('h3').textContent = filtered ? t.none_h : t.empty_h;
    emptyEl.querySelector('p').textContent = filtered ? t.none_p : t.empty_p;
    return;
  }
  gridEl.style.display = 'grid';
  emptyEl.style.display = 'none';

  gridEl.innerHTML = list.map(p => {
    const gifts = [];
    if(p.evoucher) gifts.push(`${t.evoucher} ${fmt(p.evoucher)}`);
    if(p.gift1) gifts.push(p.gift1);
    if(p.gift2) gifts.push(p.gift2);
    if(p.voucherSouth) gifts.push(`${t.south} ${fmt(p.voucherSouth)}`);
    const giftHtml = gifts.length
      ? `<div class="gift-chips">${gifts.map(g=>`<span class="gift-chip">🎁 ${g}</span>`).join('')}</div>`
      : `<div class="no-gift">${t.no_gift}</div>`;
    const catLabel = t.cats[p.cat] || p.cat;
    return `
      <div class="pcard">
        ${IMG_MAP[p.model] ? `<div class="pimg"><img src="${IMG_MAP[p.model]}" alt="${p.model}" loading="lazy"></div>` : `<div class="pimg empty"></div>`}
        <div class="pcard-top">
          <div>
            <div class="pcard-cat">${catLabel}</div>
            <div class="pcard-model">${p.model}</div>
          </div>
          ${p.discount ? `<span class="discount-badge">-${p.discount}%</span>` : ''}
        </div>
        <div class="price-row">
          <span class="price-list">${fmt(p.list)}</span>
          <span class="price-sub">${fmt(p.onetime)}</span>
        </div>
        <div class="price-caption">${t.sub_price}</div>
        <div class="monthly-grid">
          <div class="monthly-chip"><div class="mc-term">${t.m12}</div><div class="mc-amt">${fmt(p.m12)}${t.mo}</div></div>
          <div class="monthly-chip"><div class="mc-term">${t.m24}</div><div class="mc-amt">${fmt(p.m24)}${t.mo}</div></div>
          <div class="monthly-chip"><div class="mc-term">${t.m36}</div><div class="mc-amt">${fmt(p.m36)}${t.mo}</div></div>
        </div>
        <div class="gift-label">${t.gifts}</div>
        ${giftHtml}
      </div>`;
  }).join('');
}

(function init(){
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get('cat');
  if(catParam && (catParam === 'all' || CAT_ORDER.includes(catParam))){
    activeCat = catParam;
  }
  let savedLang = 'en';
  try{ savedLang = localStorage.getItem('lg_lang') || 'en'; }catch(e){}
  setLang(savedLang);
})();
</script>
