  .lang-toggle{display:flex; background:var(--lg-mist); border-radius:999px; padding:4px; gap:2px;}
  .lang-btn{border:none; background:transparent; padding:8px 16px; border-radius:999px; font-family:'Inter','Noto Sans KR',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--lg-sub); transition:all .15s ease;}

  .nav-logo-img{height:30px; display:block;}

  header.page-head{padding:48px 0 28px; text-align:center; background:radial-gradient(ellipse at 50% 0%, #fff 0%, var(--lg-mist) 130%);}

  .tabs-wrap{position:sticky; top:72px; top:calc(env(safe-area-inset-top,0px) + 72px); z-index:50; background:#fff; border-bottom:1px solid var(--lg-line); padding:14px 0;}
  .tabs{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px;}

  .tab{flex:none; border:1.5px solid var(--lg-line); background:#fff; color:var(--lg-ink); font-family:'Inter','Noto Sans KR',sans-serif; font-weight:600; font-size:14.5px; padding:11px 20px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:all .15s ease;}

  .tab.active{background:var(--lg-red); border-color:var(--lg-red); color:#fff;}
  .subtabs{margin-top:10px;}
  .tab.sub{font-size:13px; padding:7px 16px; background:var(--lg-mist); border-color:var(--lg-mist);}
  .tab.sub.active{background:var(--lg-ink); border-color:var(--lg-ink); color:#fff;}

  .results-bar{display:flex; align-items:center; justify-content:space-between; margin:28px 0 20px; flex-wrap:wrap; gap:10px;}
  .results-count{color:var(--lg-sub); font-size:14.5px; font-weight:500;}

  main{padding-bottom:80px;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}
  .pcard{background:#fff; border:1px solid var(--lg-line); border-radius:20px; padding:24px; transition:transform .2s ease, box-shadow .2s ease;}

  a.plink{display:block; color:inherit; text-decoration:none; cursor:pointer;}

  .monthly-chip{min-width:0; background:var(--lg-mist); border-radius:12px; padding:10px 6px; text-align:center;}

  .d-contact a{color:var(--lg-red);font-weight:700;text-decoration:none}
  .d-nf{text-align:center;padding:100px 20px;color:var(--lg-sub)}
</style>

 en:{n:'Urbox Voucher',h:'How to use your Urbox voucher',steps:['Tap the e-voucher link in the SMS or email, then choose to receive the gift.','Choose to receive an OTP via SMS or Zalo and enter it.','Check your UP points on the home page.','Use the points to redeem a brand voucher.','Enter the voucher code in the partner app, or show it to the cashier to scan at the counter.'],note:'If you have the UrBox Trading app installed, points are added to your wallet automatically.',full:'View full guide on Urbox ↗',close:'Close'},

 ko:{n:'Urbox 바우처',h:'Urbox 바우처 사용 방법',steps:['SMS 또는 이메일의 e-바우처 링크를 눌러 선물 받기를 선택합니다.','SMS 또는 Zalo로 OTP를 받아 입력합니다.','홈 화면에서 UP 포인트를 확인합니다.','포인트로 브랜드 바우처를 교환합니다.','제휴 앱에 바우처 코드를 입력하거나 계산대에서 직원에게 스캔을 요청합니다.'],note:'UrBox Trading 앱이 설치되어 있으면 포인트가 지갑에 자동으로 적립됩니다.',full:'Urbox에서 전체 안내 보기 ↗',close:'닫기'}
};
function escG(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function urboxChip(v){return `<button type="button" class="gift-chip gl" onclick="openUrbox()">🎁 ${UB[lang].n} ${fmt(v)} <span>ⓘ</span></button>`;}
function giftChip(code){
  const b=String(code).split('.')[0];
  const q=PRODUCTS.find(p=>p.model.split('.')[0]===b);
  if(q){const im=IMG_MAP[q.model];return `<a class="gift-chip gl" href="product-detail.html?model=${encodeURIComponent(q.model)}">${im?`<img src="${im}" alt="">`:'🎁'} ${escG(b)} <span>↗</span></a>`;}
  const g=GURL[b];
  if(g)return `<a class="gift-chip gl" href="${g.u}" target="_blank" rel="noopener">🎁 ${escG(g.n[lang])} <span>↗</span></a>`;
  return `<a class="gift-chip gl" href="https://www.google.com/search?q=${encodeURIComponent('LG '+b)}" target="_blank" rel="noopener">🎁 ${escG(b)} <span>🔍</span></a>`;
}
function giftsOf(p){const a=[];if(p.evoucher)a.push(urboxChip(p.evoucher));if(p.gift1)a.push(giftChip(p.gift1));if(p.gift2)a.push(giftChip(p.gift2));return a;}
function closeUrbox(){const m=document.getElementById('ubModal');if(m)m.remove();}
function openUrbox(){
  closeUrbox();const u=UB[lang];
  const m=document.createElement('div');m.id='ubModal';m.className='ub-modal';
  m.onclick=e=>{if(e.target===m)closeUrbox();};
  m.innerHTML=`<div class="ub-box" role="dialog" aria-modal="true"><h3>${u.h}</h3><ol>${u.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="ub-note">${u.note}</p><div class="ub-act"><a class="ub-link" href="${UB_URL}" target="_blank" rel="noopener">${u.full}</a><button type="button" class="ub-close" onclick="closeUrbox()">${u.close}</button></div></div>`;
  document.body.appendChild(m);
}
const COMING2027=['WT2525NHEGA','WT2020SHENA','WT1412SHKA'];

const SOLDOUT=['MD16GQSE0','MD19GQGE0'];
const SOLD_TXT={en:'Out of stock',vi:'Hết hàng',ko:'품절'};
const isSold=model=>SOLDOUT.includes(model.split('.')[0]);
function soldHtml(model){return isSold(model)?`<div class="soldout">${SOLD_TXT[lang]}</div>`:'';}
function comingHtml(model){return (!IMG_MAP[model]&&COMING2027.includes(model.split('.')[0]))?`<span class="coming">📦 ${COMING_TXT[lang]}</span>`:'';}
/*ENDGIFTJS*/
function seriesOf(m){
  if(/^OLED\d+W6/.test(m))return 'W6';
  if(/^OLED\d+G6/.test(m))return 'G6';
  if(/^OLED\d+C6/.test(m))return 'C6';
  if(/^OLED\d+B6/.test(m))return 'B6';
  if(/^\d+QNED86/.test(m))return 'QNED86';
  if(/^\d+QNED80/.test(m))return 'QNED80';
  if(/^\d+MRGB86/.test(m))return 'MRGB86';
  if(/^\d+NU855/.test(m))return 'NU855';
  return null;
}
const model=new URLSearchParams(location.search).get('model');
const P=PRODUCTS.find(p=>p.model===model);
function render(){
  const u=UI[lang], app=document.getElementById('app');
  document.getElementById('backTop').textContent=u.back;
  if(!P){app.innerHTML=`<div class="d-nf"><p>${u.nf}</p><a href="category-details.html" class="back-link">${u.back}</a></div>`;return;}
  const back='category-details.html?cat='+encodeURIComponent(P.cat);
  document.getElementById('backTop').href=back;
  document.getElementById('backTop').onclick=e=>{try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin&&/category-details/.test(document.referrer)){e.preventDefault();history.back();}}catch(x){}};
  document.title=P.model+' — LG Subscribe';
  const gifts=giftsOf(P);
  const base=P.model.split('.')[0], sid=seriesOf(P.model);
  let S=sid&&SERIES[sid], srcTxt=SRC_TV;
  if(MS[base]){S={name:null,sizes:null,rows:MS[base]};srcTxt=WEBSRC[base]||SRCS[P.cat]||SRC_TV;}
  let hlItems=HL[base]||(sid&&HLS[sid])||null;
  const hlHtml=hlItems?`<section class="hl"><h2>${esc(u.hl)}</h2><ul>${hlItems.map(h=>`<li><b>${esc(h.t[lang])}</b><span>${esc(h.d[lang])}</span></li>`).join('')}</ul>${(HLW.includes(base)||(sid&&!HL[base]&&HLW.includes(sid)))?`<p class="hsrc">${u.hlsrc}</p>`:''}</section>`:'';
  let specHtml='';
  if(S){
    const rows=S.rows.map(r=>{
      const v=Array.isArray(r.v)?r.v.map(x=>esc(tx(x))).join('<br>'):esc(tx(r.v));
      return `<tr><th>${esc(typeof r.k==='string'?(LABELS[r.k]?LABELS[r.k][lang]:r.k):r.k[lang])}</th><td>${v}</td></tr>`;
    });
    if(S.name){rows.unshift(`<tr><th>${u.series}</th><td>${esc(S.name)}</td></tr>`);
    rows.push(`<tr><th>${esc(LABELS.size[lang])}</th><td>${esc(S.sizes)}</td></tr>`);}
    specHtml=`<h2 class="d-sec">${u.spec}</h2><table class="spec">${rows.join('')}</table>
      <p class="d-note">${esc(srcTxt[lang])}${S.foot?' '+esc(tx(S.foot)):''}</p>`;
  } else {
    specHtml=`<h2 class="d-sec">${u.spec}</h2><p class="d-note" style="font-size:14.5px">${u.nospec}</p>`;
  }
  const cat=u.cats[P.cat]||P.cat;
  app.innerHTML=`
  <div class="crumbs"><a href="index.html">${u.home}</a>›<a href="${back}">${cat}</a>›<span>${esc(P.model)}</span></div>
  <div class="d-grid${isSold(P.model)?' is-sold':''}">
    ${IMG_MAP[P.model]?`<div class="d-img"><img src="${IMG_MAP[P.model]}" alt="${esc(P.model)}"></div>`:`<div class="d-img empty">${comingHtml(P.model)}</div>`}
    <div>
      ${soldHtml(P.model)}
      <div class="d-cat">${cat}</div>
      <h1 class="d-name">${esc(P.model)}</h1>
      <div class="d-box">
        <div class="price-row"><span class="price-list">${fmt(P.list)}</span><span class="price-sub">${fmt(P.onetime)}</span>${P.discount?`<span class="discount-badge">-${P.discount}%</span>`:''}</div>
        <div class="price-caption">${u.sub}</div>
        <div class="monthly-grid" style="margin-bottom:0">
          <div class="monthly-chip"><div class="mc-term">${u.m12}</div><div class="mc-amt">${fmt(P.m12)}<span class="mc-mo">${u.mo}</span></div></div>
          <div class="monthly-chip"><div class="mc-term">${u.m24}</div><div class="mc-amt">${fmt(P.m24)}<span class="mc-mo">${u.mo}</span></div></div>
          <div class="monthly-chip"><div class="mc-term">${u.m36}</div><div class="mc-amt">${fmt(P.m36)}<span class="mc-mo">${u.mo}</span></div></div>
        </div>
      </div>
      <div class="gift-label">${u.gifts}</div>
      ${gifts.length?`<div class="gift-chips">${gifts.join('')}</div><div class="promo-until" style="margin-top:10px">⏰ ${UNTIL[lang]}</div>`:`<div class="no-gift">${u.nogift}</div>`}
      ${hlHtml}
      ${specHtml}
      <div class="d-contact">${u.contact} <a href="tel:18001503">1800 1503</a></div>
    </div>
  </div>
  <div style="height:80px"></div>`;
}
function setLang(l){
  lang=l;
  ['EN','VI','KO'].forEach(x=>document.getElementById('btn'+x).classList.toggle('active',x.toLowerCase()===l));
  document.getElementById('htmlRoot').lang=l;
  try{localStorage.setItem('lg_lang',l)}catch(e){}
  render();
}
(function(){let s='en';try{s=localStorage.getItem('lg_lang')||'en'}catch(e){}setLang(s);})();
